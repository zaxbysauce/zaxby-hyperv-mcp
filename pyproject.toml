[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hyperv-mcp"
version = "0.1.0"
description = "MCP server for Hyper-V VM management, checkpoints, kernel debug setup, and guest execution over PowerShell Direct."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Prelude Research, Inc." }, { name = "tyler", email = "tyler@preludesecurity.com" }]
keywords = ["mcp", "windows", "hyper-v", "hyperv", "virtualization", "kdnet", "powershell-direct"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: System :: Emulators",
]
dependencies = [
    "mcp>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/originsec/hyperv-mcp"
Repository = "https://github.com/originsec/hyperv-mcp"
Issues = "https://github.com/originsec/hyperv-mcp/issues"

[project.scripts]
hyperv-mcp = "hyperv_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hyperv_mcp"]

[tool.hatch.build.targets.sdist]
include = [
    "src/hyperv_mcp",
    "README.md",
    "LICENSE",
    "NOTICE",
    "pyproject.toml",
]
