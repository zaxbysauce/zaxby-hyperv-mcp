[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hyperv-mcp"
version = "0.14.0"
description = "MCP server for Hyper-V VM management, checkpoints, kernel debug setup, guest execution, guest access diagnostics/repair, managed guest jobs, HTTP relay, and console evidence capture over PowerShell Direct."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Prelude Research, Inc." }, { name = "tyler", email = "tyler@preludesecurity.com" }]
keywords = ["mcp", "windows", "hyper-v", "hyperv", "virtualization", "kdnet", "powershell-direct"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: System :: Emulators",
]
dependencies = [
    "mcp>=2.3,<3",
    "pillow>=10.0",
    # Direct imports of the proxy transport (PRR-019: declared, not just
    # transitive via mcp), and the 3.10 exception-group backport that
    # stdio_proxy imports on the supported floor (PRR-018). mcp 2.x carries
    # its HTTP stack in the httpx2 fork (issue #16): the proxy's upstream
    # client must be the same library the SDK itself speaks. The anyio floor
    # tracks the SDK's own requirement (mcp 2.x requires anyio>=4.9); the
    # repo relies on the to_thread default-limiter API, stable well below it.
    "anyio>=4.9",
    "httpx2>=2.10",
    'exceptiongroup>=1.0.2; python_version < "3.11"',
]

[project.urls]
Homepage = "https://github.com/zaxbysauce/zaxby-hyperv-mcp"
Repository = "https://github.com/zaxbysauce/zaxby-hyperv-mcp"
Issues = "https://github.com/zaxbysauce/zaxby-hyperv-mcp/issues"

[project.scripts]
hyperv-mcp = "hyperv_mcp.server:main"
hyperv-mcp-http = "hyperv_mcp.http_entry:main"

[project.optional-dependencies]
wmi = [
    # Redundant since mcp 2.x: the SDK requires pywin32>=311 on win32
    # unconditionally, so every Windows install already carries it. Kept
    # for explicit non-SDK installs.
    "pywin32>=311; platform_system == 'Windows'",
]
dev = [
    "pytest>=8",
    "pytest-timeout>=2",
    "ruff>=0.6",
    "mypy>=1.11",
    "psutil>=5.9.6",
    # Issue #110: the wheel-gate test invokes hatchling's PEP 517
    # build_wheel directly (no network, no workflow change) to assert the
    # built artifact ships guest/uia_helper.ps1.
    "hatchling>=1.27",
]

[tool.hatch.build.targets.wheel]
packages = ["src/hyperv_mcp"]
# PRR-021: the soak harness ships in the wheel too. `packages` above only
# maps src/hyperv_mcp into the archive root, so the top-level script needs
# an explicit mapping; force-include places it at scripts/soak_bench.py in
# the wheel, i.e. <site-packages>/scripts/soak_bench.py after `pip install`.
# The `python scripts/soak_bench.py` form documented in the README is the
# source-checkout / sdist-extraction invocation; from an installed wheel,
# run `python <site-packages>/scripts/soak_bench.py`.
force-include = { "scripts/soak_bench.py" = "scripts/soak_bench.py" }

[tool.hatch.build.targets.sdist]
include = [
    "src/hyperv_mcp",
    # scripts/soak_bench.py is the documented entry point for the soak
    # benchmark (README "Soak benchmark"): the sdist carries the scripts/
    # directory at its root (so an extraction supports `python
    # scripts/soak_bench.py`), and the wheel force-includes the one file
    # (see the wheel target above). Omitting both made the documented entry
    # point work only from a git checkout.
    "scripts",
    "README.md",
    "LICENSE",
    "NOTICE",
    "pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
addopts = "-q --import-mode=prepend"
timeout = 120
timeout_method = "thread"
pythonpath = ["src"]
markers = [
    "hyperv_real: drives a real disposable Hyper-V VM (opt-in via tests/integration + env guards)",
]

[tool.ruff]
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# tests/unit/test_f02_checkpoint_type.py is the byte-locked acceptance-check
# file of the issue-#26 red checkpoint (manifest blob e0e987f4...): its
# bytes are frozen by the trace protocol, so its author-era import order
# cannot be re-sorted by the linter.
"tests/unit/test_f02_checkpoint_type.py" = ["I001"]
# tests/unit/test_admission_fairness.py is the byte-locked acceptance-check
# file of the 64-68-collated trace (manifest blob f3278410...): its bytes are
# frozen by the trace protocol, and its admission import deliberately sits
# below a comment that pins the base-leg RED signature, so the linter must
# not re-sort it either.
"tests/unit/test_admission_fairness.py" = ["I001"]
# tests/unit/test_b01_agent_identity.py is the byte-locked acceptance-check
# file of the issue-#10 red checkpoint (manifest blob 3008efa1...): its bytes
# are frozen by the trace protocol, so its author-era import order cannot be
# re-sorted by the linter.
"tests/unit/test_b01_agent_identity.py" = ["I001"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = true
# scripts/ is in scope (PRR-020): the soak harness is shipped, executed
# code — ruff-only coverage let a real inference bug ship unnoticed. It is
# clean under the same config as src/hyperv_mcp.
files = ["src/hyperv_mcp", "scripts"]
