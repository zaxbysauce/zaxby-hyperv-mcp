[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hyperv-mcp"
version = "0.4.0"
description = "MCP server for Hyper-V VM management, checkpoints, kernel debug setup, guest execution, guest access diagnostics/repair, managed guest jobs, HTTP relay, and console evidence capture over PowerShell Direct."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Prelude Research, Inc." }, { name = "tyler", email = "tyler@preludesecurity.com" }]
keywords = ["mcp", "windows", "hyper-v", "hyperv", "virtualization", "kdnet", "powershell-direct"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: System :: Emulators",
]
dependencies = [
    "mcp>=2.3,<3",
    "pillow>=10.0",
    # Direct imports of the proxy transport (PRR-019: declared, not just
    # transitive via mcp), and the 3.10 exception-group backport that
    # stdio_proxy imports on the supported floor (PRR-018). mcp 2.x carries
    # its HTTP stack in the httpx2 fork (issue #16): the proxy's upstream
    # client must be the same library the SDK itself speaks. The anyio floor
    # tracks the SDK's own requirement (mcp 2.x requires anyio>=4.9); the
    # repo relies on the to_thread default-limiter API, stable well below it.
    "anyio>=4.9",
    "httpx2>=2.10",
    'exceptiongroup>=1.0.2; python_version < "3.11"',
]

[project.urls]
Homepage = "https://github.com/zaxbysauce/zaxby-hyperv-mcp"
Repository = "https://github.com/zaxbysauce/zaxby-hyperv-mcp"
Issues = "https://github.com/zaxbysauce/zaxby-hyperv-mcp/issues"

[project.scripts]
hyperv-mcp = "hyperv_mcp.server:main"
hyperv-mcp-http = "hyperv_mcp.http_entry:main"

[project.optional-dependencies]
wmi = [
    # Redundant since mcp 2.x: the SDK requires pywin32>=311 on win32
    # unconditionally, so every Windows install already carries it. Kept
    # for explicit non-SDK installs.
    "pywin32>=311; platform_system == 'Windows'",
]
dev = [
    "pytest>=8",
    "pytest-timeout>=2",
    "ruff>=0.6",
    "mypy>=1.11",
    "psutil>=5.9.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/hyperv_mcp"]

[tool.hatch.build.targets.sdist]
include = [
    "src/hyperv_mcp",
    "README.md",
    "LICENSE",
    "NOTICE",
    "pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
addopts = "-q --import-mode=prepend"
timeout = 120
timeout_method = "thread"
pythonpath = ["src"]
markers = [
    "hyperv_real: drives a real disposable Hyper-V VM (opt-in via tests/integration + env guards)",
]

[tool.ruff]
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# tests/unit/test_b01_agent_identity.py is the byte-locked acceptance-check
# file of the issue-#10 red checkpoint (manifest blob 3008efa1...): its bytes
# are frozen by the trace protocol, so its author-era import order cannot be
# re-sorted by the linter.
"tests/unit/test_b01_agent_identity.py" = ["I001"]
# Same rule for the issue-#17 red checkpoint (manifest blob ee03b42b...). The
# check file's bytes are frozen by the trace protocol, so the author-era import
# order (I001), the unused `io` import it carried while the decode still
# returned PNG bytes (F401), and the `zip` over two equal-length byte strings
# in the all-65,536-values equivalence check (B905 — both operands are built to
# the same length by construction) cannot be edited out without breaking the
# freeze. The assertions are unchanged; only the linter is told to look away.
"tests/unit/test_d01_screenshot_decode.py" = ["I001", "F401", "B905"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = true
files = ["src/hyperv_mcp"]
