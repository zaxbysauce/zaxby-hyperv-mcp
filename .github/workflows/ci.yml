name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Lint, types, and mocked/local-PowerShell unit tests only.
    # These do NOT validate real Hyper-V behavior — see tests/integration.
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff
        run: ruff check src tests
      - name: Mypy
        run: mypy src/hyperv_mcp
      - name: Unit tests (no Hyper-V)
        run: pytest tests/unit
