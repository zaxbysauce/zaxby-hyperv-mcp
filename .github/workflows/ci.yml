name: ci

on:
  push:
    branches: [main]
  pull_request:

# Cancel an in-progress run when a NEW member joins the same group. For a
# pull_request the group is the merge ref (refs/pull/<N>/merge), which carries
# no head-SHA component, so every run attempt for a PR — for ANY commit — is
# one group member and cancellation is ordered by ARRIVAL, not by commit
# recency. That covers the intended case (pushing again supersedes the old
# commit's run) and also means re-running an older commit's run cancels the
# newer head run in flight; the newer run must then be re-run. That is the
# trade the push-cancels-push behaviour requires, since a head-SHA-keyed group
# would stop a new push from cancelling the old run at all.
#
# Never cancel push-to-main runs. Non-PR runs get a unique group (run_id): with
# a shared group, a newer queued main push would still REPLACE an older pending
# one (GitHub holds at most one pending run per group), which is what would
# leave a middle commit untested.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    # Lint, types, and mocked/local-PowerShell unit tests only.
    # These do NOT validate real Hyper-V behavior — see tests/integration.
    runs-on: windows-latest
    # Successful jobs observed at <= 5.8 min (261 jobs, 2026-09-25..10-18);
    # 15 min gives ~2.5x headroom.
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff
        run: ruff check src tests scripts
      - name: Mypy
        # scripts/ is type-checked too (PRR-020 half): it was ruff-covered
        # only, which left soak_bench.py's one real inference error (an
        # unannotated dict join) invisible. It is clean under the same
        # config as src, so no separate scope is needed.
        run: mypy src/hyperv_mcp scripts
      - name: Unit tests (no Hyper-V)
        run: pytest tests/unit
